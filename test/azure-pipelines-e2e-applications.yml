pr: none

trigger: none

jobs:
  - job: E2E_Tests_Group_1
    timeoutInMinutes: 60
    pool: pins-template-test
    steps:
      - checkout: self
        persistCredentials: true

      - script: |
          export NVM_DIR="/usr/local/nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          # Prefer agent default Node; fall back to nvm if needed
          if node -v 2>/dev/null | grep -q '^v22\.'; then
            echo "Node 22 already active: $(node -v)"
          else
            echo "Attempting nvm use 22"
            nvm use 22 || true
          fi

          echo "node: $(node -v || echo 'not found')"
          echo "npm: $(npm -v || echo 'not found')"
          which node || true
          which npm || true
        displayName: "Verify Node and npm"
